services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      REPLICA_URLS: http://replica1:4001,http://replica2:4002,http://replica3:4003
      GATEWAY_PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/status"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  replica1:
    build: ./replica
    command: ["node", "--watch", "../replica1/server.js"]
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - ./replica1:/app/replica1:ro
    environment:
      REPLICA_ID: replica1
      PORT: 4001
      PEERS: http://replica2:4002,http://replica3:4003
      GATEWAY_URL: http://gateway:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4001/status"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  replica2:
    build: ./replica
    command: ["node", "--watch", "../replica2/server.js"]
    ports:
      - "127.0.0.1:4002:4002"
    volumes:
      - ./replica2:/app/replica2:ro
    environment:
      REPLICA_ID: replica2
      PORT: 4002
      PEERS: http://replica1:4001,http://replica3:4003
      GATEWAY_URL: http://gateway:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4002/status"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  replica3:
    build: ./replica
    command: ["node", "--watch", "../replica3/server.js"]
    ports:
      - "127.0.0.1:4003:4003"
    volumes:
      - ./replica3:/app/replica3:ro
    environment:
      REPLICA_ID: replica3
      PORT: 4003
      PEERS: http://replica1:4001,http://replica2:4002
      GATEWAY_URL: http://gateway:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4003/status"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped
